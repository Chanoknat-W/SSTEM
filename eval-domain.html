<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ประเมินครู | SST-EM</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .domain-tabs { display:flex; border-bottom:2px solid var(--border); margin-bottom:20px; }
    .domain-tab { flex:1; padding:12px 4px; background:none; border:none; border-bottom:3px solid transparent; margin-bottom:-2px; font-size:13px; font-weight:600; color:var(--text-muted); cursor:pointer; transition:.2s; }
    .domain-tab.active { color:var(--primary); border-bottom-color:var(--primary); }
    .domain-tab.done { color:var(--primary-dark); }
    .domain-tab.done::after { content:' ✓'; }
    .summary-domain-card { text-align:center; background:var(--primary-light); border-radius:10px; padding:14px 8px; }
    .summary-total { text-align:center; padding:20px; background:var(--primary); border-radius:12px; color:#fff; margin-bottom:16px; }
    .doc-panel { background:var(--primary-light); border-radius:10px; margin-bottom:16px; overflow:hidden; }
    .doc-panel-header { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; cursor:pointer; font-weight:600; font-size:14px; color:var(--primary-dark); }
    .doc-panel-body { padding:0 16px 14px; display:none; }
    .doc-panel-body.open { display:block; }
    .doc-domain-label { font-size:12px; font-weight:700; color:var(--text-muted); margin:10px 0 6px; text-transform:uppercase; letter-spacing:.5px; }
    .doc-file-link { display:flex; align-items:center; gap:8px; padding:7px 10px; background:#fff; border-radius:6px; margin-bottom:6px; font-size:13px; text-decoration:none; color:var(--primary-dark); border:1px solid var(--border); }
    .doc-file-link:hover { background:var(--primary-light); }
  </style>
</head>
<body class="evaluator-theme">
<main class="page">

  <div class="page-header">
    <div class="badge">ผู้ประเมิน</div>
    <h1>ตอบคำถามประเมิน</h1>
    <p>สามารถสลับด้านได้อิสระ เมื่อตอบครบ 3 ด้านจะปรากฏปุ่มสรุปคะแนน</p>
  </div>

  <!-- Document viewer (collapsible) -->
  <div class="doc-panel" id="doc-panel">
    <div class="doc-panel-header" onclick="toggleDocs()">
      <span>📂 เอกสารประกอบการประเมิน</span>
      <span id="doc-arrow">▼</span>
    </div>
    <div class="doc-panel-body" id="doc-panel-body">
      <div id="doc-loading" style="font-size:13px; color:var(--text-muted);">กำลังโหลดเอกสาร...</div>
    </div>
  </div>

  <!-- Tab buttons -->
  <div class="domain-tabs">
    <button class="domain-tab active" id="tab-btn-domain1" onclick="switchTab('domain1')">ด้านที่ 1</button>
    <button class="domain-tab" id="tab-btn-domain2" onclick="switchTab('domain2')">ด้านที่ 2</button>
    <button class="domain-tab" id="tab-btn-domain3" onclick="switchTab('domain3')">ด้านที่ 3</button>
  </div>

  <!-- Domain panels -->
  <div id="panel-domain1"></div>
  <div id="panel-domain2" style="display:none;"></div>
  <div id="panel-domain3" style="display:none;"></div>

  <!-- Summary panel -->
  <div id="panel-summary" style="display:none;">
    <div class="card" style="margin-bottom:16px;">
      <h2 style="font-size:18px; font-weight:700; color:var(--primary-dark); margin-bottom:16px;">สรุปคะแนนการประเมิน</h2>
      <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:16px;" id="summary-domain-scores"></div>
      <div class="summary-total" id="summary-total"></div>
    </div>

    <!-- Per-domain feedback + suggestion -->
    <div id="domain-feedback-list"></div>

    <div id="save-error" class="error-msg"></div>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="hideSummary()">← แก้ไขคำตอบ</button>
      <button class="btn btn-primary" id="btn-save" onclick="saveResult()">บันทึกผลการประเมิน</button>
    </div>
  </div>

  <!-- Bottom actions -->
  <div id="bottom-actions" class="btn-row" style="margin-top:8px;">
    <button class="btn btn-secondary" onclick="window.location.href='home.html'">🏠</button>
    <button class="btn btn-secondary" id="btn-back">← กลับ</button>
    <button class="btn btn-secondary" id="btn-next">ถัดไป →</button>
    <button class="btn btn-primary" id="btn-summary" onclick="showSummary()" style="display:none;">สรุปคะแนน →</button>
  </div>

</main>

<div id="footer-container"></div>


<script src="js/questions.js"></script>
<script src="js/auth.js"></script>
<script src="js/supabase.js"></script>
<script src="js/include.js"></script>

<script>
    loadComponent('footer-container', 'components/footer.html');

  Auth.requireAuth();

  const evalId = localStorage.getItem('sst_eval_target_id');
  if (!evalId) window.location.href = 'eval-search.html';

  document.getElementById('btn-back').onclick = () => {
    window.location.href = 'eval-score.html?id=' + evalId;
  };

  // answers[domain][qid] = score
  const answers = { domain1: {}, domain2: {}, domain3: {} };
  ['domain1','domain2','domain3'].forEach(dk => {
    try { answers[dk] = JSON.parse(localStorage.getItem('sst_eval_' + dk) || '{}'); } catch {}
  });

  // Render questions for each domain
  ['domain1','domain2','domain3'].forEach(dk => {
    const domain    = QUESTIONS[dk];
    const panel     = document.getElementById('panel-' + dk);
    const saved     = answers[dk];

    const header = document.createElement('div');
    header.innerHTML = `
      <div style="margin-bottom:16px;">
        <div style="font-size:16px; font-weight:700; color:var(--primary-dark);">${domain.title}</div>
        <div style="font-size:13px; color:var(--text-muted);">${domain.subtitle}</div>
      </div>
      <div id="err-${dk}" class="error-msg">⚠️ กรุณาตอบทุกข้อ</div>`;
    panel.appendChild(header);

    const container = document.createElement('div');
    container.id = 'questions-' + dk;

    domain.questions.forEach((q, i) => {
      const choicesHtml = q.choices.map(c => `
        <label class="choice ${saved[q.id] == c.score ? 'selected' : ''}"
          data-qid="${q.id}" data-score="${c.score}" data-domain="${dk}">
          <input type="radio" name="${dk}_${q.id}" value="${c.score}" ${saved[q.id] == c.score ? 'checked' : ''} />
          <div class="choice-indicator"></div>
          <span class="choice-score">${c.score} คะแนน</span>
          <span class="choice-text">${c.text}</span>
        </label>`).join('');

      const card = document.createElement('div');
      card.className = 'question-card';
      card.id = 'card-' + dk + '-' + q.id;
      card.innerHTML = `
        <div class="question-number">ข้อที่ ${i+1} จาก ${domain.questions.length}</div>
        <div class="question-text">${q.text}</div>
        <div class="choices">${choicesHtml}</div>`;
      container.appendChild(card);
    });

    container.addEventListener('click', e => {
      const choice = e.target.closest('.choice');
      if (!choice) return;
      const qid = choice.dataset.qid;
      const d   = choice.dataset.domain;
      container.querySelectorAll(`.choice[data-qid="${qid}"]`).forEach(el => el.classList.remove('selected'));
      choice.classList.add('selected');
      choice.querySelector('input').checked = true;
      answers[d][qid] = parseInt(choice.dataset.score);
      document.getElementById('card-' + d + '-' + qid).style.border = '';
      localStorage.setItem('sst_eval_' + d, JSON.stringify(answers[d]));
      updateTabStatus();
      checkAllAnswered();
    });

    panel.appendChild(container);
  });

  function updateTabStatus() {
    ['domain1','domain2','domain3'].forEach(dk => {
      const done = QUESTIONS[dk].questions.every(q => answers[dk][q.id] !== undefined);
      const btn  = document.getElementById('tab-btn-' + dk);
      btn.classList.toggle('done', done);
    });
  }

  function checkAllAnswered() {
    const allDone = ['domain1','domain2','domain3'].every(dk =>
      QUESTIONS[dk].questions.every(q => answers[dk][q.id] !== undefined)
    );
    document.getElementById('btn-summary').style.display = allDone ? '' : 'none';
  }

  const TAB_ORDER = ['domain1','domain2','domain3'];
  let currentTab = 'domain1';

  function switchTab(dk) {
    TAB_ORDER.forEach(d => {
      document.getElementById('panel-' + d).style.display = d === dk ? 'block' : 'none';
      document.getElementById('tab-btn-' + d).classList.toggle('active', d === dk);
    });
    document.getElementById('panel-summary').style.display = 'none';
    document.getElementById('bottom-actions').style.display = '';
    currentTab = dk;
    updateNavButtons();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function updateNavButtons() {
    const idx = TAB_ORDER.indexOf(currentTab);
    const btnBack = document.getElementById('btn-back');
    const btnNext = document.getElementById('btn-next');
    if (idx === 0) {
      btnBack.textContent = '← กลับ';
      btnBack.onclick = () => { window.location.href = 'eval-score.html?id=' + evalId; };
    } else {
      btnBack.textContent = '← ด้านที่ ' + idx;
      btnBack.onclick = () => switchTab(TAB_ORDER[idx - 1]);
    }
    if (idx < TAB_ORDER.length - 1) {
      btnNext.style.display = '';
      btnNext.textContent = 'ด้านที่ ' + (idx + 2) + ' →';
      btnNext.onclick = () => switchTab(TAB_ORDER[idx + 1]);
    } else {
      btnNext.style.display = 'none';
    }
  }

  function showSummary() {
    const d1 = Object.values(answers.domain1).reduce((s,v) => s+(v||0), 0);
    const d2 = Object.values(answers.domain2).reduce((s,v) => s+(v||0), 0);
    const d3 = Object.values(answers.domain3).reduce((s,v) => s+(v||0), 0);
    const total = d1 + d2 + d3;
    const level = total >= 60 ? 'ดีมาก' : total >= 46 ? 'ดี' : total >= 31 ? 'พอใช้' : 'ควรปรับปรุง';

    const domainScores = [d1, d2, d3];
    const domainLabels = ['การจัดการเรียนรู้', 'เครือข่ายและบริบท', 'สมรรถนะและภาวะผู้นำ'];
    const domainKeys   = ['domain1', 'domain2', 'domain3'];

    document.getElementById('summary-domain-scores').innerHTML =
      domainLabels.map((label, i) => {
        const fb = getDomainFeedback(domainKeys[i], domainScores[i]);
        return `
          <div class="summary-domain-card" style="border-top:3px solid ${fb.color};">
            <div style="font-size:11px; color:var(--text-muted); margin-bottom:4px;">ด้านที่ ${i+1}</div>
            <div style="font-size:11px; color:var(--text-muted); margin-bottom:6px;">${label}</div>
            <div style="font-size:30px; font-weight:800; color:${fb.color};">${domainScores[i]}</div>
            <div style="font-size:11px; color:var(--text-muted); margin-bottom:4px;">/ 24</div>
            <div style="font-size:11px; font-weight:700; color:${fb.color};">${fb.label}</div>
          </div>`;
      }).join('');

    document.getElementById('summary-total').innerHTML = `
      <div style="font-size:13px; opacity:.85;">คะแนนรวมทั้งหมด</div>
      <div style="font-size:44px; font-weight:900; line-height:1.1;">${total}</div>
      <div style="font-size:13px; opacity:.85;">/ 72 คะแนน</div>
      <div style="font-size:17px; font-weight:700; margin-top:8px;">ระดับ: ${level}</div>`;

    // Domain feedback (auto)
    document.getElementById('domain-feedback-list').innerHTML =
      domainKeys.map((dk, i) => {
        const fb = getDomainFeedback(dk, domainScores[i]);
        return `
          <div class="card" style="margin-bottom:12px; border-left:4px solid ${fb.color};">
            <div style="font-size:14px; font-weight:700; color:${fb.color}; margin-bottom:6px;">
              ด้านที่ ${i+1} — ${domainLabels[i]}
            </div>
            <div style="background:${fb.bg}; border-radius:6px; padding:10px 12px; font-size:13px; color:#333;">
              💡 ${fb.text}
            </div>
          </div>`;
      }).join('') + `
      <div class="card" style="margin-bottom:14px;">
        <label style="font-size:14px; font-weight:700; color:var(--primary-dark); display:block; margin-bottom:8px;">
          คำแนะนำเพิ่มเติมจากผู้ประเมิน <span style="font-size:13px; font-weight:400; color:var(--text-muted);">(ไม่บังคับ)</span>
        </label>
        <textarea id="suggestions" rows="4" placeholder="ระบุคำแนะนำเพิ่มเติมสำหรับครู..."
          style="width:100%; padding:10px; border:1px solid var(--border); border-radius:8px; font-size:14px; font-family:inherit; box-sizing:border-box; resize:vertical;"></textarea>
      </div>`;

    ['domain1','domain2','domain3'].forEach(d => {
      document.getElementById('panel-' + d).style.display = 'none';
    });
    document.getElementById('bottom-actions').style.display = 'none';
    document.getElementById('panel-summary').style.display = 'block';
  }

  function hideSummary() {
    document.getElementById('panel-summary').style.display = 'none';
    document.getElementById('bottom-actions').style.display = '';
    switchTab(currentTab);
  }

  async function saveResult() {
    const btn = document.getElementById('btn-save');
    const err = document.getElementById('save-error');
    btn.disabled = true;
    btn.textContent = 'กำลังบันทึก...';
    err.classList.remove('show');
    try {
      const suggestions = document.getElementById('suggestions')?.value.trim() || '';
      await SupabaseClient.saveEvalScore(evalId, answers, suggestions);
      ['sst_eval_domain1','sst_eval_domain2','sst_eval_domain3','sst_eval_target_id'].forEach(k => localStorage.removeItem(k));
      window.location.href = 'eval-result.html?id=' + evalId;
    } catch (e) {
      if (e.message === '__SESSION_EXPIRED__') return;
      err.textContent = 'เกิดข้อผิดพลาด: ' + e.message;
      err.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'บันทึกผลการประเมิน';
    }
  }

  const DOMAIN_FEEDBACK = {
    domain1: [
      { min:20, label:'ดีมาก',       color:'#1B5E20', bg:'#E8F5E9', text:'ครูแสดงทักษะการจัดการเรียนรู้แบบบูรณาการสำหรับชั้นเรียนหลายระดับในระดับสูง ขอแนะนำให้แบ่งปันแนวทางเป็นแบบอย่างแก่เพื่อนครู' },
      { min:15, label:'ดี',          color:'#2E7D32', bg:'#F1F8E9', text:'ครูมีทักษะการจัดการเรียนรู้ดี ปรับกิจกรรมได้เหมาะสม ควรพัฒนาการออกแบบกิจกรรมบูรณาการทุกชั้นเรียนให้มากขึ้น' },
      { min:10, label:'พอใช้',       color:'#F57F17', bg:'#FFF8E1', text:'ครูมีพื้นฐานการจัดการเรียนรู้ แต่ยังมีโอกาสพัฒนาการนำบริบทท้องถิ่นและการวางแผนบูรณาการ แนะนำให้ศึกษาเทคนิค Multi-grade Teaching เพิ่มเติม' },
      { min: 0, label:'ควรปรับปรุง', color:'#B71C1C', bg:'#FFEBEE', text:'ครูควรได้รับการพัฒนาทักษะการจัดการเรียนรู้ในชั้นเรียนขนาดเล็กอย่างเป็นระบบ แนะนำให้เข้าร่วมการอบรมและศึกษาดูงานโรงเรียนที่มีบริบทคล้ายกัน' },
    ],
    domain2: [
      { min:20, label:'ดีมาก',       color:'#1B5E20', bg:'#E8F5E9', text:'ครูสร้างความสัมพันธ์กับชุมชนและเครือข่ายได้ดีเยี่ยม ควรขยายเครือข่ายไปยังโรงเรียนใกล้เคียงและหน่วยงานในพื้นที่เพิ่มเติม' },
      { min:15, label:'ดี',          color:'#2E7D32', bg:'#F1F8E9', text:'ครูมีการสื่อสารกับชุมชนและผู้ปกครองดี ควรเพิ่มความถี่ในการเชิญภูมิปัญญาท้องถิ่นมาร่วมกิจกรรมการเรียนรู้' },
      { min:10, label:'พอใช้',       color:'#F57F17', bg:'#FFF8E1', text:'ครูเริ่มสร้างความสัมพันธ์กับชุมชนแต่ยังจำกัด ควรกำหนดแผนการมีส่วนร่วมชุมชนอย่างชัดเจนในแต่ละภาคเรียน' },
      { min: 0, label:'ควรปรับปรุง', color:'#B71C1C', bg:'#FFEBEE', text:'ครูควรเริ่มสร้างความสัมพันธ์กับชุมชนและผู้ปกครองอย่างเป็นระบบ แนะนำให้จัดประชุมผู้ปกครองและหาทางดึงทรัพยากรชุมชนมาใช้ในการเรียนรู้' },
    ],
    domain3: [
      { min:20, label:'ดีมาก',       color:'#1B5E20', bg:'#E8F5E9', text:'ครูแสดงภาวะผู้นำทางวิชาชีพระดับสูง มีการสะท้อนคิดและพัฒนาตนเองต่อเนื่อง เหมาะที่จะเป็นที่ปรึกษาหรือผู้นำ PLC' },
      { min:15, label:'ดี',          color:'#2E7D32', bg:'#F1F8E9', text:'ครูมีสมรรถนะวิชาชีพและทัศนคติที่ดี ควรเพิ่มบทบาทในวง PLC และแบ่งปันนวัตกรรมกับเพื่อนครูมากขึ้น' },
      { min:10, label:'พอใช้',       color:'#F57F17', bg:'#FFF8E1', text:'ครูมีพื้นฐานสมรรถนะวิชาชีพ แต่ยังมีพื้นที่ในการพัฒนา ควรเข้าร่วม PLC อย่างสม่ำเสมอและแสวงหาความรู้ด้วยตนเอง' },
      { min: 0, label:'ควรปรับปรุง', color:'#B71C1C', bg:'#FFEBEE', text:'ครูควรพัฒนาสมรรถนะวิชาชีพและทักษะการสะท้อนคิด แนะนำให้เข้ารับการอบรม เข้าร่วม PLC และศึกษาแนวทางรับมือกับความท้าทายในโรงเรียนขนาดเล็ก' },
    ],
  };

  function getDomainFeedback(dk, score) {
    return DOMAIN_FEEDBACK[dk].find(f => score >= f.min);
  }

  const FILE_LABEL = {
    d1_1:'1.1 แบบบันทึกการสะท้อนคิด', d1_2:'1.2 แบบสังเกตการสอน / ร่องรอยใบงาน', d1_3:'1.3 แบบสังเกตห้องเรียน / ภาพถ่ายสื่อ',
    d2_1:'2.1 แบบประเมินการมีส่วนร่วมชุมชน', d2_2:'2.2 บันทึกเชิญวิทยากร / ภาพถ่ายกิจกรรม', d2_3:'2.3 แบบสัมภาษณ์ตัวแทนกรรมการสถานศึกษา',
    d3_1:'3.1 เกณฑ์รูบริคภาวะผู้นำทางวิชาการ', d3_2:'3.2 แบบบันทึก One-Page Reflector', d3_3:'3.3 แบบสังเกตพฤติกรรม / สัมภาษณ์เพื่อนครู', d3_4:'3.4 แบบสังเกตพฤติกรรมการทำงาน',
  };
  const DOC_DOMAINS = [
    { prefix:'d1', label:'ด้านที่ 1 — การจัดการเรียนรู้' },
    { prefix:'d2', label:'ด้านที่ 2 — สถาบันและบริบท' },
    { prefix:'d3', label:'ด้านที่ 3 — พฤติกรรมวิชาชีพ' },
  ];

  async function loadDocs() {
    try {
      const row = await SupabaseClient.getEvaluation(evalId);
      const files = row?.files || {};
      const keys = Object.keys(files);
      const body = document.getElementById('doc-panel-body');
      if (!keys.length) {
        body.innerHTML = '<div style="font-size:13px;color:var(--text-muted);">ยังไม่มีเอกสารแนบ</div>';
        return;
      }
      body.innerHTML = DOC_DOMAINS.map(({ prefix, label }) => {
        const domainKeys = keys.filter(k => k.startsWith(prefix));
        if (!domainKeys.length) return '';
        return `<div class="doc-domain-label">${label}</div>` +
          domainKeys.map(k => `
            <a href="${files[k].url}" target="_blank" class="doc-file-link">
              📄 ${FILE_LABEL[k] || k}
            </a>`).join('');
      }).join('');
    } catch {
      document.getElementById('doc-panel-body').innerHTML = '<div style="font-size:13px;color:var(--text-muted);">โหลดเอกสารไม่สำเร็จ</div>';
    }
  }

  function toggleDocs() {
    const body  = document.getElementById('doc-panel-body');
    const arrow = document.getElementById('doc-arrow');
    const open  = body.classList.toggle('open');
    arrow.textContent = open ? '▲' : '▼';
    if (open && document.getElementById('doc-loading')) loadDocs();
  }

  updateTabStatus();
  checkAllAnswered();
  updateNavButtons();
</script>
</body>
</html>
