<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>สมัครสมาชิก | SST-EM</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<main class="page">
  <div class="cover" style="padding-bottom:8px;">
    <img src="img/ksu-logo.svg" alt="มหาวิทยาลัยกาฬสินธุ์" class="univ-logo" onerror="this.style.display='none'" />
    <h1>SST-EM</h1>
    <p class="subtitle">ระบบประเมินการจัดการศึกษาสำหรับครูในสถานศึกษาขนาดเล็ก</p>
  </div>

  <div class="card">
    <div class="page-header" style="text-align:left; margin-bottom:20px;">
      <h1>สมัครสมาชิก</h1>
      <p>กรอกข้อมูลเพื่อสร้างบัญชีใหม่</p>
    </div>

    <div id="error-msg" class="error-msg"></div>

    <div class="form-group">
      <label for="display-name">ชื่อ-นามสกุล</label>
      <input type="text" id="display-name" placeholder="เช่น นางสาวสมใจ ใจดี" autocomplete="name" />
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="example@email.com" autocomplete="email" />
    </div>
    <div class="form-group">
      <label for="password">รหัสผ่าน</label>
      <input type="password" id="password" placeholder="อย่างน้อย 6 ตัวอักษร" autocomplete="new-password" />
    </div>
    <div class="form-group">
      <label for="confirm-password">ยืนยันรหัสผ่าน</label>
      <input type="password" id="confirm-password" placeholder="กรอกรหัสผ่านอีกครั้ง" autocomplete="new-password" />
    </div>

    <div class="form-group">
      <label>บทบาท</label>
      <div class="role-cards" style="margin-bottom:0;">
        <button type="button" class="role-card" id="card-self" onclick="selectRole('self')">
          <div class="role-number" id="num-self">1</div>
          <div class="role-icon-large">👨‍🏫</div>
          <div class="role-label">ผู้รับการประเมิน</div>
          <div class="role-sub">ครู</div>
        </button>
        <button type="button" class="role-card" id="card-eval" onclick="selectRole('eval')">
          <div class="role-number" id="num-eval">2</div>
          <div class="role-icon-large">📋</div>
          <div class="role-label">ผู้ประเมิน</div>
          <div class="role-sub">ครู · ผู้อำนวยการ · ศึกษานิเทศก์</div>
        </button>
      </div>
      <input type="hidden" id="selected-role" value="" />
    </div>

    <button class="btn btn-primary" id="btn-register" onclick="doRegister()">สมัครสมาชิก</button>

    <p style="text-align:center; margin-top:20px; font-size:14px; color:var(--text-muted);">
      มีบัญชีอยู่แล้ว?
      <a href="login.html" style="color:var(--primary); font-weight:700;">เข้าสู่ระบบ</a>
    </p>
  </div>
</main>

<footer class="site-footer">
  พัฒนาโดย <strong>นายวชิระ ชาวเหนือ</strong> &nbsp;·&nbsp; มหาวิทยาลัยกาฬสินธุ์
</footer>

<script src="js/auth.js"></script>
<script>
  let selectedRole = '';

  function selectRole(role) {
    selectedRole = role;
    document.getElementById('selected-role').value = role;
    document.getElementById('card-self').classList.toggle('role-card-selected', role === 'self');
    document.getElementById('card-eval').classList.toggle('role-card-selected', role === 'eval');
  }

  async function doRegister() {
    const displayName = document.getElementById('display-name').value.trim();
    const email       = document.getElementById('email').value.trim();
    const password    = document.getElementById('password').value;
    const confirm     = document.getElementById('confirm-password').value;
    const err         = document.getElementById('error-msg');
    const btn         = document.getElementById('btn-register');

    err.classList.remove('show');

    if (!displayName || !email || !password || !confirm) {
      err.textContent = 'กรุณากรอกข้อมูลให้ครบทุกช่อง';
      err.classList.add('show'); return;
    }
    if (password.length < 6) {
      err.textContent = 'รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร';
      err.classList.add('show'); return;
    }
    if (password !== confirm) {
      err.textContent = 'รหัสผ่านไม่ตรงกัน';
      err.classList.add('show'); return;
    }
    if (!selectedRole) {
      err.textContent = 'กรุณาเลือกบทบาท';
      err.classList.add('show'); return;
    }

    btn.disabled = true;
    btn.textContent = 'กำลังสมัครสมาชิก...';

    try {
      const user = await Auth.register(email, password, displayName, selectedRole);
      Auth.redirectByRole(user);
    } catch (e) {
      err.textContent = e.message;
      err.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'สมัครสมาชิก';
    }
  }
</script>
</body>
</html>
