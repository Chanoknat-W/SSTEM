<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>สมัครสมาชิก | SST-EM</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<main class="page">
  <div class="cover" style="padding-bottom:8px;">
    <img src="img/ksu-logo.svg" alt="มหาวิทยาลัยกาฬสินธุ์" class="univ-logo" onerror="this.style.display='none'" />
    <h1>SST-EM</h1>
    <p class="subtitle">ระบบประเมินการจัดการศึกษาสำหรับครูในสถานศึกษาขนาดเล็ก</p>
  </div>

  <div class="card">
    <div class="page-header" style="text-align:left; margin-bottom:20px;">
      <h1>สมัครสมาชิก</h1>
      <p>กรอกข้อมูลเพื่อสร้างบัญชีใหม่</p>
    </div>

    <div id="error-msg" class="error-msg"></div>

    <div class="form-section-label">ข้อมูลบัญชี</div>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="example@email.com" autocomplete="email" />
    </div>
    <div class="form-group">
      <label for="password">รหัสผ่าน</label>
      <input type="password" id="password" placeholder="อย่างน้อย 6 ตัวอักษร" autocomplete="new-password" />
    </div>
    <div class="form-group">
      <label for="confirm-password">ยืนยันรหัสผ่าน</label>
      <input type="password" id="confirm-password" placeholder="กรอกรหัสผ่านอีกครั้ง" autocomplete="new-password" />
    </div>

    <div class="form-section-label" style="margin-top:8px;">ข้อมูลส่วนตัว</div>
    <div class="form-group">
      <label for="display-name">ชื่อ-นามสกุล</label>
      <input type="text" id="display-name" placeholder="เช่น นางสาวสมใจ ใจดี" autocomplete="name" />
    </div>
    <div class="form-group">
      <label for="position">ตำแหน่ง</label>
      <select id="position">
        <option value="">-- เลือกตำแหน่ง --</option>
        <option>ครู</option>
        <option>ผู้อำนวยการโรงเรียน</option>
        <option>ศึกษานิเทศก์</option>
      </select>
    </div>
    <div class="form-group">
      <label for="grade">ชั้นที่สอน</label>
      <select id="grade">
        <option value="">-- เลือกชั้นที่สอน --</option>
        <optgroup label="อนุบาล">
          <option>อนุบาล 1</option><option>อนุบาล 2</option><option>อนุบาล 3</option>
        </optgroup>
        <optgroup label="ประถมศึกษา">
          <option>ป.1</option><option>ป.2</option><option>ป.3</option>
          <option>ป.4</option><option>ป.5</option><option>ป.6</option>
        </optgroup>
        <optgroup label="มัธยมศึกษาตอนต้น">
          <option>ม.1</option><option>ม.2</option><option>ม.3</option>
        </optgroup>
        <optgroup label="มัธยมศึกษาตอนปลาย">
          <option>ม.4</option><option>ม.5</option><option>ม.6</option>
        </optgroup>
      </select>
    </div>
    <div class="form-group">
      <label for="school">โรงเรียน</label>
      <input type="text" id="school" placeholder="เช่น โรงเรียนบ้านหนองเล็ก" />
    </div>
    <div class="form-group">
      <label for="district">สังกัด</label>
      <input type="text" id="district" placeholder="เช่น สพป.กาฬสินธุ์ เขต 3" />
    </div>
    <div class="form-group">
      <label for="semester">ภาคเรียน / ปีการศึกษา</label>
      <input type="text" id="semester" placeholder="เช่น ภาคเรียนที่ 1/2567" />
    </div>

    <button class="btn btn-primary" id="btn-register" onclick="doRegister()">สมัครสมาชิก</button>

    <p style="text-align:center; margin-top:20px; font-size:14px; color:var(--text-muted);">
      มีบัญชีอยู่แล้ว?
      <a href="login.html" style="color:var(--primary); font-weight:700;">เข้าสู่ระบบ</a>
    </p>
  </div>
</main>

<footer class="site-footer">
  พัฒนาโดย <strong>นายวชิระ ชาวเหนือ</strong> &nbsp;·&nbsp; มหาวิทยาลัยกาฬสินธุ์
</footer>

<script src="js/auth.js"></script>
<script>
  async function doRegister() {
    const email       = document.getElementById('email').value.trim();
    const password    = document.getElementById('password').value;
    const confirm     = document.getElementById('confirm-password').value;
    const displayName = document.getElementById('display-name').value.trim();
    const position    = document.getElementById('position').value;
    const grade       = document.getElementById('grade').value;
    const school      = document.getElementById('school').value.trim();
    const district    = document.getElementById('district').value.trim();
    const semester    = document.getElementById('semester').value.trim();
    const err         = document.getElementById('error-msg');
    const btn         = document.getElementById('btn-register');

    err.classList.remove('show');

    if (!email || !password || !confirm || !displayName || !position || !school || !district || !semester) {
      err.textContent = 'กรุณากรอกข้อมูลให้ครบทุกช่อง';
      err.classList.add('show'); return;
    }
    if (password.length < 6) {
      err.textContent = 'รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร';
      err.classList.add('show'); return;
    }
    if (password !== confirm) {
      err.textContent = 'รหัสผ่านไม่ตรงกัน';
      err.classList.add('show'); return;
    }

    btn.disabled = true;
    btn.textContent = 'กำลังสมัครสมาชิก...';

    try {
      await Auth.register(email, password, { display_name:displayName, position, grade, school, district, semester });
      window.location.href = 'home.html';
    } catch (e) {
      err.textContent = e.message;
      err.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'สมัครสมาชิก';
    }
  }
</script>
</body>
</html>
