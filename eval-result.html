<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ผลการประเมิน | SST-EM</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
<main class="page">
  <div id="loading" class="card" style="text-align:center; color:var(--text-muted); padding:32px;">กำลังโหลด...</div>
  <div id="content" style="display:none;"></div>
</main>

<footer class="site-footer">
  พัฒนาโดย <strong>นายวชิระ ชาวเหนือ</strong> &nbsp;·&nbsp; มหาวิทยาลัยกาฬสินธุ์
</footer>

<script src="js/auth.js"></script>
<script src="js/supabase.js"></script>
<script>
  const params   = new URLSearchParams(location.search);
  const evalId   = params.get('id');
  const viewMode = params.get('view'); // 'self' = teacher viewing

  if (!evalId) window.location.href = 'login.html';

  const user = Auth.getUser();
  if (!user) window.location.href = 'login.html';

  const DOMAIN_NAMES = ['การจัดการเรียนรู้','สถาบันและบริบท','พฤติกรรมวิชาชีพ'];

  const DOMAIN_FEEDBACK = {
    domain1: [
      { min:20, label:'ดีมาก',       color:'#1B5E20', bg:'#E8F5E9', text:'ครูแสดงทักษะการจัดการเรียนรู้แบบบูรณาการสำหรับชั้นเรียนหลายระดับในระดับสูง ขอแนะนำให้แบ่งปันแนวทางเป็นแบบอย่างแก่เพื่อนครู' },
      { min:15, label:'ดี',          color:'#2E7D32', bg:'#F1F8E9', text:'ครูมีทักษะการจัดการเรียนรู้ดี ปรับกิจกรรมได้เหมาะสม ควรพัฒนาการออกแบบกิจกรรมบูรณาการทุกชั้นเรียนให้มากขึ้น' },
      { min:10, label:'พอใช้',       color:'#F57F17', bg:'#FFF8E1', text:'ครูมีพื้นฐานการจัดการเรียนรู้ แต่ยังมีโอกาสพัฒนาการนำบริบทท้องถิ่นและการวางแผนบูรณาการ แนะนำให้ศึกษาเทคนิค Multi-grade Teaching เพิ่มเติม' },
      { min: 0, label:'ควรปรับปรุง', color:'#B71C1C', bg:'#FFEBEE', text:'ครูควรได้รับการพัฒนาทักษะการจัดการเรียนรู้ในชั้นเรียนขนาดเล็กอย่างเป็นระบบ แนะนำให้เข้าร่วมการอบรมและศึกษาดูงานโรงเรียนที่มีบริบทคล้ายกัน' },
    ],
    domain2: [
      { min:20, label:'ดีมาก',       color:'#1B5E20', bg:'#E8F5E9', text:'ครูสร้างความสัมพันธ์กับชุมชนและเครือข่ายได้ดีเยี่ยม ควรขยายเครือข่ายไปยังโรงเรียนใกล้เคียงและหน่วยงานในพื้นที่เพิ่มเติม' },
      { min:15, label:'ดี',          color:'#2E7D32', bg:'#F1F8E9', text:'ครูมีการสื่อสารกับชุมชนและผู้ปกครองดี ควรเพิ่มความถี่ในการเชิญภูมิปัญญาท้องถิ่นมาร่วมกิจกรรมการเรียนรู้' },
      { min:10, label:'พอใช้',       color:'#F57F17', bg:'#FFF8E1', text:'ครูเริ่มสร้างความสัมพันธ์กับชุมชนแต่ยังจำกัด ควรกำหนดแผนการมีส่วนร่วมชุมชนอย่างชัดเจนในแต่ละภาคเรียน' },
      { min: 0, label:'ควรปรับปรุง', color:'#B71C1C', bg:'#FFEBEE', text:'ครูควรเริ่มสร้างความสัมพันธ์กับชุมชนและผู้ปกครองอย่างเป็นระบบ แนะนำให้จัดประชุมผู้ปกครองและหาทางดึงทรัพยากรชุมชนมาใช้ในการเรียนรู้' },
    ],
    domain3: [
      { min:20, label:'ดีมาก',       color:'#1B5E20', bg:'#E8F5E9', text:'ครูแสดงภาวะผู้นำทางวิชาชีพระดับสูง มีการสะท้อนคิดและพัฒนาตนเองต่อเนื่อง เหมาะที่จะเป็นที่ปรึกษาหรือผู้นำ PLC' },
      { min:15, label:'ดี',          color:'#2E7D32', bg:'#F1F8E9', text:'ครูมีสมรรถนะวิชาชีพและทัศนคติที่ดี ควรเพิ่มบทบาทในวง PLC และแบ่งปันนวัตกรรมกับเพื่อนครูมากขึ้น' },
      { min:10, label:'พอใช้',       color:'#F57F17', bg:'#FFF8E1', text:'ครูมีพื้นฐานสมรรถนะวิชาชีพ แต่ยังมีพื้นที่ในการพัฒนา ควรเข้าร่วม PLC อย่างสม่ำเสมอและแสวงหาความรู้ด้วยตนเอง' },
      { min: 0, label:'ควรปรับปรุง', color:'#B71C1C', bg:'#FFEBEE', text:'ครูควรพัฒนาสมรรถนะวิชาชีพและทักษะการสะท้อนคิด แนะนำให้เข้ารับการอบรม เข้าร่วม PLC และศึกษาแนวทางรับมือกับความท้าทายในโรงเรียนขนาดเล็ก' },
    ],
  };

  function getDomainFeedback(dk, score) {
    return DOMAIN_FEEDBACK[dk].find(f => score >= f.min);
  }

  function calcTotal(answers) {
    return Object.values(answers || {}).reduce((s, v) => s + (parseInt(v) || 0), 0);
  }

  function levelLabel(score) {
    if (score >= 20) return { label:'ดีมาก', color:'#1B5E20', bg:'#E8F5E9' };
    if (score >= 15) return { label:'ดี',     color:'#2E7D32', bg:'#F1F8E9' };
    if (score >= 10) return { label:'พอใช้',  color:'#F57F17', bg:'#FFF8E1' };
    return               { label:'ปรับปรุง', color:'#B71C1C', bg:'#FFEBEE' };
  }

  function totalLevelLabel(total) {
    if (total >= 60) return { label:'ดีมาก', color:'#1B5E20', bg:'#E8F5E9' };
    if (total >= 46) return { label:'ดี',     color:'#2E7D32', bg:'#F1F8E9' };
    if (total >= 31) return { label:'พอใช้',  color:'#F57F17', bg:'#FFF8E1' };
    return               { label:'ปรับปรุง', color:'#B71C1C', bg:'#FFEBEE' };
  }

  async function load() {
    try {
      const row = await SupabaseClient.getEvaluation(evalId);
      if (!row) throw new Error('ไม่พบข้อมูล');

      // Load pending answers (from eval domain pages) or existing saved answers
      let d1Ans = JSON.parse(localStorage.getItem('sst_eval_domain1') || 'null');
      let d2Ans = JSON.parse(localStorage.getItem('sst_eval_domain2') || 'null');
      let d3Ans = JSON.parse(localStorage.getItem('sst_eval_domain3') || 'null');
      let suggestions = JSON.parse(localStorage.getItem('sst_eval_suggestions') || 'null');

      // If no pending answers, use saved ones from DB
      if (!d1Ans && row.eval_scores) {
        d1Ans = row.eval_scores.domain1 || null;
        d2Ans = row.eval_scores.domain2 || null;
        d3Ans = row.eval_scores.domain3 || null;
        suggestions = row.eval_suggestions || {};
      }

      const d1Total = calcTotal(d1Ans);
      const d2Total = calcTotal(d2Ans);
      const d3Total = calcTotal(d3Ans);
      const total   = d1Total + d2Total + d3Total;
      const totalLv = totalLevelLabel(total);
      const lv1 = levelLabel(d1Total);
      const lv2 = levelLabel(d2Total);
      const lv3 = levelLabel(d3Total);

      document.getElementById('loading').style.display = 'none';
      const content = document.getElementById('content');
      content.style.display = 'block';

      content.innerHTML = `
        <div class="page-header">
          <div class="badge">ผลการประเมิน</div>
          <h1>ผลการประเมิน</h1>
        </div>

        <!-- Header -->
        <div class="result-header" style="margin-bottom:20px;">
          <h2>${row.teacher_name || '-'}</h2>
          <div class="school-info">${row.school || ''} · ${row.grade || ''} · ${row.semester || ''}</div>
          <div class="level-badge" style="background:${totalLv.bg}; color:${totalLv.color}; border:2px solid ${totalLv.color}; margin-top:12px;">${totalLv.label}</div>
          <div><span class="total-score" style="font-size:40px; font-weight:800;">${total}</span><span class="score-max"> / 72 คะแนน</span></div>
        </div>

        <!-- Domain Scores -->
        <div class="domain-scores" style="margin-bottom:20px;">
          ${[{t:d1Total,lv:lv1},{t:d2Total,lv:lv2},{t:d3Total,lv:lv3}].map((d,i)=>`
            <div class="domain-score-card" style="border-top:4px solid ${d.lv.color};">
              <div class="label">ด้านที่ ${i+1}<br/>${DOMAIN_NAMES[i]}</div>
              <div class="score" style="color:${d.lv.color};">${d.t}</div>
              <div class="max">/ 24</div>
              <div style="font-size:12px; font-weight:700; color:${d.lv.color}; margin-top:2px;">${d.lv.label}</div>
            </div>`).join('')}
        </div>

        <!-- Chart -->
        <div class="chart-container" style="margin-bottom:20px;">
          <canvas id="radar-chart"></canvas>
        </div>

        <!-- Suggestions form (evaluator) or display (teacher) -->
        <div id="suggestions-area" style="margin-bottom:20px;"></div>

        <!-- Eval by -->
        ${row.eval_by_name ? `<div style="font-size:13px; color:var(--text-muted); text-align:center; margin-bottom:16px;">ประเมินโดย: ${row.eval_by_name}</div>` : ''}

        <!-- Actions -->
        <div class="btn-row no-print" id="action-btns"></div>
      `;

      // Radar Chart
      new Chart(document.getElementById('radar-chart').getContext('2d'), {
        type: 'radar',
        data: {
          labels: DOMAIN_NAMES.map((d,i) => `ด้านที่ ${i+1}\n${d}`),
          datasets: [{
            label: 'คะแนนผู้ประเมิน',
            data: [d1Total, d2Total, d3Total],
            backgroundColor: 'rgba(46,125,50,0.15)',
            borderColor: '#2E7D32', borderWidth: 2.5,
            pointBackgroundColor: '#2E7D32', pointRadius: 6,
          }],
        },
        options: {
          responsive: true,
          scales: { r: { min:0, max:24, ticks:{stepSize:6}, pointLabels:{font:{size:13,weight:'600'}} } },
          plugins: { legend:{display:false} },
        },
      });

      // Domain feedback (auto) + evaluator suggestions — side by side per domain
      const suggestArea = document.getElementById('suggestions-area');
      const s = row.eval_suggestions || {};
      const isObj = typeof s === 'object';
      const domainScores = [d1Total, d2Total, d3Total];
      const domainKeys   = ['domain1','domain2','domain3'];
      const suggestKeys  = ['d1','d2','d3'];

      // Auto feedback section
      const autoFeedbackHtml = `
        <h3 style="font-size:15px;font-weight:700;color:var(--primary-dark);margin-bottom:12px;">ผลการประเมินรายด้าน</h3>
        ${domainKeys.map((dk, i) => {
          const fb = getDomainFeedback(dk, domainScores[i]);
          return `
            <div style="border:1px solid var(--border); border-left:4px solid ${fb.color}; border-radius:8px; padding:14px; margin-bottom:12px;">
              <div style="font-size:13px; font-weight:700; color:${fb.color}; margin-bottom:8px;">
                ด้านที่ ${i+1} — ${DOMAIN_NAMES[i]}
                <span style="float:right; font-size:12px; background:${fb.bg}; color:${fb.color}; padding:2px 8px; border-radius:10px;">${fb.label}</span>
              </div>
              <div style="background:${fb.bg}; border-radius:6px; padding:8px 12px; font-size:13px; color:#333;">
                💡 ${fb.text}
              </div>
            </div>`;
        }).join('')}`;

      // Evaluator suggestions section (single block)
      const evalText = typeof s === 'string' ? s : (isObj ? [s.d1,s.d2,s.d3].filter(Boolean).join('\n') : '');
      const evalSuggestHtml = evalText ? `
        <h3 style="font-size:15px;font-weight:700;color:var(--primary-dark);margin-top:20px;margin-bottom:12px;">คำแนะนำจากผู้ประเมิน</h3>
        <div style="background:var(--primary-light);border-radius:8px;padding:12px 16px;font-size:14px;white-space:pre-wrap;">${evalText}</div>` : '';

      suggestArea.innerHTML = autoFeedbackHtml + evalSuggestHtml;

      // Criteria table
      const criteriaHtml = `
        <div class="card" style="margin-bottom:20px;">
          <h3 style="font-size:15px;font-weight:700;color:var(--primary-dark);margin-bottom:12px;">เกณฑ์การประเมิน</h3>
          <table style="width:100%;border-collapse:collapse;font-size:14px;">
            <thead>
              <tr style="background:var(--primary-light);">
                <th style="padding:8px 12px;text-align:left;border-radius:6px 0 0 0;">ระดับ</th>
                <th style="padding:8px 12px;text-align:center;">คะแนนรวม</th>
                <th style="padding:8px 12px;text-align:center;border-radius:0 6px 0 0;">ร้อยละ</th>
              </tr>
            </thead>
            <tbody>
              <tr><td style="padding:8px 12px;border-bottom:1px solid var(--border);">ดีมาก</td><td style="padding:8px 12px;text-align:center;border-bottom:1px solid var(--border);">60–72</td><td style="padding:8px 12px;text-align:center;border-bottom:1px solid var(--border);">≥ 83%</td></tr>
              <tr><td style="padding:8px 12px;border-bottom:1px solid var(--border);">ดี</td><td style="padding:8px 12px;text-align:center;border-bottom:1px solid var(--border);">46–59</td><td style="padding:8px 12px;text-align:center;border-bottom:1px solid var(--border);">64–82%</td></tr>
              <tr><td style="padding:8px 12px;border-bottom:1px solid var(--border);">พอใช้</td><td style="padding:8px 12px;text-align:center;border-bottom:1px solid var(--border);">31–45</td><td style="padding:8px 12px;text-align:center;border-bottom:1px solid var(--border);">43–62%</td></tr>
              <tr><td style="padding:8px 12px;">ควรปรับปรุง</td><td style="padding:8px 12px;text-align:center;">0–30</td><td style="padding:8px 12px;text-align:center;">≤ 42%</td></tr>
            </tbody>
          </table>
        </div>`;
      document.getElementById('suggestions-area').insertAdjacentHTML('afterend', criteriaHtml);

      // Action buttons
      const btnArea = document.getElementById('action-btns');
      if (viewMode === 'self') {
        btnArea.innerHTML = `
          <button class="btn btn-secondary" onclick="window.location.href='my-results.html'" style="flex:1;">← กลับ</button>
          <button class="btn btn-print" onclick="window.print()" style="flex:1;">🖨️ พิมพ์</button>`;
      } else {
        btnArea.innerHTML = `
          <button class="btn btn-secondary" onclick="window.location.href='eval-search.html'" style="flex:1;">← กลับรายชื่อ</button>
          <button class="btn btn-print" onclick="window.print()" style="flex:1;">🖨️ พิมพ์</button>`;
      }

    } catch (e) {
      document.getElementById('loading').textContent = 'เกิดข้อผิดพลาด: ' + e.message;
    }
  }

  load();
</script>
</body>
</html>
