<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ผู้รับการประเมิน | SST-EM</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <main class="page">

    <!-- Info Form -->
    <div id="section-form">
      <nav class="progress-bar"
        style="margin: -24px -16px 24px; position:static; box-shadow:none; border-bottom:1px solid var(--border);">
        <div class="progress-steps">
          <div class="step active">
            <div class="step-dot">1</div>
          </div>
          <div class="step-line"></div>
          <div class="step">
            <div class="step-dot">2</div>
          </div>
          <div class="step-line"></div>
          <div class="step">
            <div class="step-dot">3</div>
          </div>
        </div>
      </nav>

      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:20px;">
          <div class="page-header" style="text-align:left; margin-bottom:0;">
            <div class="badge">ขั้นตอนที่ 1 จาก 3</div>
            <h1>ตรวจสอบข้อมูลส่วนตัวของผู้รับการประเมิน</h1>
            <p>ข้อมูลดึงมาจากโปรไฟล์ของท่าน หากต้องการแก้ไขกรุณากดปุ่ม แก้ไขโปรไฟล์</p>
          </div>
          <button class="btn btn-secondary" onclick="window.location.href='profile.html'"
            style="padding:6px 12px; font-size:13px; white-space:nowrap; flex-shrink:0;">✏️ แก้ไขโปรไฟล์</button>
        </div>

        <div id="error-msg" class="error-msg">ข้อมูลไม่ครบ กรุณาแก้ไขโปรไฟล์ก่อนดำเนินการต่อ</div>
        <div id="profile-display" style="display:grid; gap:10px; margin-bottom:20px;"></div>

        <div class="btn-row">
          <button class="btn btn-secondary" onclick="window.location.href='my-results.html'">← กลับ</button>
          <button class="btn btn-primary" onclick="goToUpload()">ถัดไป →</button>
        </div>
      </div>
    </div>

  </main>

  <div id="footer-container"></div>

  <script src="js/state.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/include.js"></script>

  <script>
    loadComponent('footer-container', 'components/footer.html');

    const user = Auth.requireAuth();
    if (!user) throw new Error('not auth');

    let currentProfile = { ...user };

    showForm();

    function renderProfileDisplay(p) {
      const isSupervisor = p.position === 'ศึกษานิเทศก์';
      const rows = [
        { label: 'ชื่อ-นามสกุล', value: p.display_name },
        { label: 'ตำแหน่ง',      value: p.position },
        !isSupervisor ? { label: 'ชั้นที่สอน', value: p.grade }    : null,
        !isSupervisor ? { label: 'โรงเรียน',   value: p.school }   : null,
        { label: 'สังกัด',       value: p.district },
        { label: 'ภาคเรียน',     value: p.semester },
      ].filter(Boolean);
      document.getElementById('profile-display').innerHTML = rows.map(r =>
        `<div style="display:flex; gap:8px; padding:8px 12px; background:var(--primary-light); border-radius:8px;">
          <span style="font-size:13px; color:var(--text-muted); min-width:90px;">${r.label}</span>
          <span style="font-size:14px; font-weight:600; color:var(--primary-dark);">${r.value || '<span style="color:var(--text-muted);font-weight:400;">ยังไม่ได้กรอก</span>'}</span>
        </div>`
      ).join('');
    }

    async function showForm() {
      renderProfileDisplay(currentProfile);

      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/profiles?id=eq.${user.id}&select=*`, {
          headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${Auth.getToken()}` }
        });
        const data = await res.json();
        if (data[0]) {
          currentProfile = { ...user, ...data[0] };
          localStorage.setItem('sst_user', JSON.stringify(currentProfile));
          renderProfileDisplay(currentProfile);
        }
      } catch { /* ใช้ cache แทน */ }
    }

    function goToUpload() {
      const p = currentProfile;
      const isSupervisor = p.position === 'ศึกษานิเทศก์';
      const err = document.getElementById('error-msg');

      if (!p.display_name || !p.position || (!isSupervisor && !p.grade) || (!isSupervisor && !p.school) || !p.district || !p.semester) {
        err.classList.add('show'); return;
      }
      err.classList.remove('show');
      State.save('sst_info', {
        teacher_name: p.display_name,
        position: p.position,
        grade: p.grade || '',
        school: p.school || '',
        district: p.district,
        semester: p.semester,
      });
      window.location.href = 'upload.html';
    }
  </script>
</body>

</html>
