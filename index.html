<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SST-EM | ระบบประเมินครูโรงเรียนขนาดเล็ก</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav class="progress-bar">
    <div class="progress-steps">
      <div class="step active"><div class="step-dot">1</div></div>
      <div class="step-line"></div>
      <div class="step"><div class="step-dot">2</div></div>
      <div class="step-line"></div>
      <div class="step"><div class="step-dot">3</div></div>
    </div>
  </nav>

  <main class="page">
    <div class="card">
      <div class="page-header" style="text-align:left; margin-bottom:20px;">
        <div class="badge">ผู้รับการประเมิน · ขั้นตอนที่ 1 จาก 3</div>
        <h1>กรอกข้อมูลเบื้องต้น</h1>
        <p>ข้อมูลนี้จะปรากฏในรายงานผลการประเมิน</p>
      </div>

      <div id="error-msg" class="error-msg">กรุณากรอกข้อมูลให้ครบทุกช่อง</div>

      <div id="user-greeting" style="margin-bottom:16px; font-size:14px; color:var(--text-muted);"></div>

      <div class="form-group">
        <label for="teacher-name">ชื่อ-นามสกุล</label>
        <input type="text" id="teacher-name" placeholder="เช่น นางสาวสมใจ ใจดี" autocomplete="name" />
      </div>
      <div class="form-group">
        <label for="grade">ชั้นที่สอน</label>
        <select id="grade">
          <option value="">-- เลือกชั้นที่สอน --</option>
          <optgroup label="อนุบาล">
            <option>อนุบาล 1</option><option>อนุบาล 2</option><option>อนุบาล 3</option>
          </optgroup>
          <optgroup label="ประถมศึกษา">
            <option>ป.1</option><option>ป.2</option><option>ป.3</option>
            <option>ป.4</option><option>ป.5</option><option>ป.6</option>
          </optgroup>
          <optgroup label="มัธยมศึกษาตอนต้น">
            <option>ม.1</option><option>ม.2</option><option>ม.3</option>
          </optgroup>
          <optgroup label="มัธยมศึกษาตอนปลาย">
            <option>ม.4</option><option>ม.5</option><option>ม.6</option>
          </optgroup>
        </select>
      </div>
      <div class="form-group">
        <label for="school">โรงเรียน</label>
        <input type="text" id="school" placeholder="เช่น โรงเรียนบ้านหนองเล็ก" />
      </div>
      <div class="form-group">
        <label for="district">สังกัด</label>
        <input type="text" id="district" placeholder="เช่น สพป.กาฬสินธุ์ เขต 3" />
      </div>
      <div class="form-group">
        <label for="semester">ภาคเรียน / ปีการศึกษา</label>
        <input type="text" id="semester" placeholder="เช่น ภาคเรียนที่ 1/2567" />
      </div>

      <div class="btn-row" style="margin-top:4px;">
        <button class="btn btn-secondary" onclick="Auth.logout()">ออกจากระบบ</button>
        <button class="btn btn-primary" onclick="startEval()">เริ่มระบบประเมิน →</button>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    พัฒนาโดย <strong>นายวชิระ ชาวเหนือ</strong> &nbsp;·&nbsp; มหาวิทยาลัยกาฬสินธุ์
  </footer>

  <script src="js/state.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const user = Auth.requireAuth('self');
    if (!user) throw new Error('not auth');

    document.getElementById('user-greeting').textContent =
      'สวัสดี, ' + (user.display_name || user.email);

    const saved = State.load('sst_info');
    if (saved) {
      document.getElementById('teacher-name').value = saved.teacher_name || '';
      document.getElementById('grade').value         = saved.grade        || '';
      document.getElementById('school').value        = saved.school       || '';
      document.getElementById('district').value      = saved.district     || '';
      document.getElementById('semester').value      = saved.semester     || '';
    }

    function startEval() {
      const teacher_name = document.getElementById('teacher-name').value.trim();
      const grade        = document.getElementById('grade').value;
      const school       = document.getElementById('school').value.trim();
      const district     = document.getElementById('district').value.trim();
      const semester     = document.getElementById('semester').value.trim();
      const err = document.getElementById('error-msg');

      if (!teacher_name || !grade || !school || !district || !semester) {
        err.classList.add('show');
        return;
      }
      err.classList.remove('show');
      State.save('sst_info', { role:'self', teacher_name, grade, school, district, semester });
      window.location.href = 'domain1.html';
    }
  </script>
</body>
</html>
