<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ผลการประเมินของฉัน | SST-EM</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<main class="page">
  <div class="page-header" style="background:transparent; border-bottom:2px solid var(--primary-light); padding-bottom:16px; margin-bottom:20px;">
    <div style="font-size:48px; margin-bottom:8px;">👨‍🏫</div>
    <div class="badge">ผู้รับการประเมิน</div>
    <h1>ผลการประเมินของฉัน</h1>
    <p id="user-name" style="font-size:14px; color:var(--text-muted);"></p>
  </div>

  <div style="display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap;">
    <a href="home.html" class="btn btn-secondary" style="text-decoration:none;">🏠 หน้าหลัก</a>
    <a href="start.html" class="btn btn-primary" style="flex:1; text-decoration:none;">+ ส่งแบบประเมินใหม่</a>
  </div>

  <div id="loading" class="card" style="text-align:center; color:var(--text-muted); padding:32px;">
    กำลังโหลดข้อมูล...
  </div>
  <div id="results-list"></div>
</main>

<div id="footer-container"></div>


<script src="js/auth.js"></script>
<script src="js/supabase.js"></script>
<script src="js/include.js"></script>

<script>
    loadComponent('footer-container', 'components/footer.html');

  const user = Auth.requireAuth();
  if (!user) throw new Error('not auth');
  document.getElementById('user-name').textContent = user.email;

  const STATUS_LABEL = {
    draft:        { text: 'ยังไม่ส่ง',                    color: '#757575', bg: '#F5F5F5' },
    pending:      { text: '🕐 รอรับการประเมิน',           color: '#E65100', bg: '#FFF3E0' },
    evaluated:    { text: '✅ ได้รับการประเมินแล้ว',       color: '#1B5E20', bg: '#E8F5E9' },
    doc_rejected: { text: '❌ เอกสารไม่ถูกต้อง',          color: '#B71C1C', bg: '#FFEBEE' },
  };

  const FILE_LABEL = {
    d1_1:'1.1 แบบบันทึกการสะท้อนคิด', d1_2:'1.2 แบบสังเกตการสอน / ร่องรอยใบงาน', d1_3:'1.3 แบบสังเกตห้องเรียน / ภาพถ่ายสื่อ',
    d2_1:'2.1 แบบประเมินการมีส่วนร่วมชุมชน', d2_2:'2.2 บันทึกเชิญวิทยากร / ภาพถ่ายกิจกรรม', d2_3:'2.3 แบบสัมภาษณ์ตัวแทนกรรมการสถานศึกษา',
    d3_1:'3.1 เกณฑ์รูบริคภาวะผู้นำทางวิชาการ', d3_2:'3.2 แบบบันทึก One-Page Reflector', d3_3:'3.3 แบบสังเกตพฤติกรรม / สัมภาษณ์เพื่อนครู', d3_4:'3.4 แบบสังเกตพฤติกรรมการทำงาน',
  };

  async function load() {
    try {
      const rows = await SupabaseClient.getMyEvaluations();
      document.getElementById('loading').style.display = 'none';
      const container = document.getElementById('results-list');

      if (!rows.length) {
        container.innerHTML = '<div class="card" style="text-align:center;color:var(--text-muted);padding:32px;">ยังไม่มีผลการประเมิน</div>';
        return;
      }

      rows.forEach(row => {
        const st = STATUS_LABEL[row.eval_status] || STATUS_LABEL.draft;

        let failedDocsHtml = '';
        if (row.eval_status === 'doc_rejected') {
          console.log('doc_rejected row id:', row.id, 'doc_checks:', row.doc_checks);
          let checks = row.doc_checks;
          if (typeof checks === 'string') { try { checks = JSON.parse(checks); } catch { checks = {}; } }
          checks = checks || {};
          const failed = Object.keys(checks).filter(k => checks[k] === 'fail');
          if (failed.length) {
            failedDocsHtml = '<div style="margin-top:8px; padding:10px 12px; background:#FFEBEE; border-radius:8px; border-left:3px solid #B71C1C;">'
              + '<div style="font-size:12px; font-weight:700; color:#B71C1C; margin-bottom:6px;">เอกสารที่ไม่ถูกต้อง:</div>'
              + failed.map(k => `<div style="font-size:12px; color:#B71C1C;">✗ ${FILE_LABEL[k] || k}</div>`).join('')
              + '</div>';
          } else {
            failedDocsHtml = '<div style="margin-top:8px; padding:6px 12px; background:#FFEBEE; border-radius:8px; font-size:12px; color:#B71C1C;">มีเอกสารไม่ถูกต้อง</div>';
          }
        }
        const card = document.createElement('div');
        card.className = 'card';
        card.style.marginBottom = '14px';
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:8px; margin-bottom:12px;">
            <div>
              <div style="font-size:16px; font-weight:700; color:var(--primary-dark);">${row.teacher_name || '-'}</div>
              <div style="font-size:13px; color:var(--text-muted);">${row.school || ''} ${row.grade ? '· ' + row.grade : ''} · ${row.semester || ''}</div>
              ${row.submitted_at ? `<div style="font-size:12px; color:var(--text-muted);">📤 ส่งเมื่อ ${new Date(row.submitted_at).toLocaleString('th-TH')}</div>` : ''}
              ${row.evaluated_at ? `<div style="font-size:12px; color:var(--text-muted);">✅ ประเมินเมื่อ ${new Date(row.evaluated_at).toLocaleString('th-TH')}</div>` : ''}
              ${row.eval_by_name ? `<div style="font-size:12px; color:var(--text-muted);">👤 ประเมินโดย: <strong>${row.eval_by_name}</strong></div>` : ''}
              ${row.level && row.eval_status !== 'doc_rejected' ? `<div style="font-size:13px; font-weight:700; color:var(--primary-dark); margin-top:4px;">ระดับ: ${row.level}</div>` : ''}
              ${failedDocsHtml}
            </div>
            <span style="padding:4px 12px; border-radius:20px; font-size:13px; font-weight:700;
              background:${st.bg}; color:${st.color};">${st.text}</span>
          </div>
          <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:12px; ${row.eval_status === 'doc_rejected' ? 'display:none;' : ''}">
            ${['การจัดการเรียนรู้','สถาบันและบริบท','พฤติกรรมวิชาชีพ']
              .map((d, i) => `<div style="text-align:center; background:var(--primary-light); border-radius:8px; padding:8px;">
                <div style="font-size:11px; color:var(--text-muted);">ด้านที่ ${i+1}</div>
                <div style="font-size:20px; font-weight:800; color:var(--primary-dark);">${[row.domain1_total,row.domain2_total,row.domain3_total][i] ?? '-'}</div>
                <div style="font-size:11px; color:var(--text-muted);">/ 24</div>
              </div>`).join('')}
          </div>
          <div style="display:flex; gap:8px; flex-wrap:wrap;">
            ${row.eval_status === 'draft' ? `
              <a href="upload.html?id=${row.id}" class="btn btn-secondary" style="flex:1; font-size:14px; text-decoration:none; text-align:center;">✏️ แก้ไขและส่งเอกสาร</a>
            ` : row.eval_status === 'doc_rejected' ? `
              <a href="upload.html?id=${row.id}&resubmit=true" class="btn btn-primary" style="flex:1; font-size:14px; text-decoration:none; text-align:center; background:#B71C1C;">แก้ไขเอกสารและส่งใหม่</a>
            ` : row.eval_status === 'evaluated' ? `
              <a href="eval-result.html?id=${row.id}&view=self" class="btn btn-primary" style="flex:1; font-size:14px; text-decoration:none; text-align:center;">ดูผลการประเมิน</a>
            ` : `
              <div style="flex:1; text-align:center; font-size:14px; color:var(--text-muted); padding:14px 0;">รอผู้ประเมินดำเนินการ</div>
            `}
          </div>`;
        container.appendChild(card);
      });
    } catch (e) {
      if (e.message === '__SESSION_EXPIRED__') return;
      document.getElementById('loading').textContent = 'เกิดข้อผิดพลาด: ' + e.message;
    }
  }

  load();
</script>
</body>
</html>
