<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>แก้ไขโปรไฟล์ | SST-EM</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<main class="page">
  <div class="page-header">
    <div class="badge">ข้อมูลส่วนตัว</div>
    <h1>แก้ไขโปรไฟล์</h1>
    <p>ข้อมูลนี้จะถูกดึงมาใช้โดยอัตโนมัติในการประเมินแต่ละครั้ง</p>
  </div>

  <div class="card">
    <div id="error-msg" class="error-msg"></div>
    <div id="success-msg" style="display:none; background:var(--primary-light); color:var(--primary-dark);
      border-radius:8px; padding:12px 16px; font-size:14px; font-weight:600; margin-bottom:16px;
      border:1px solid var(--primary);">✅ บันทึกข้อมูลเรียบร้อยแล้ว</div>

    <div class="form-section-label">ข้อมูลบัญชี</div>
    <div class="form-group">
      <label>Email (แก้ไขไม่ได้)</label>
      <input type="text" id="email" disabled
        style="background:#F5F5F5; color:var(--text-muted); cursor:not-allowed;" />
    </div>

    <div class="form-section-label" style="margin-top:8px;">ข้อมูลส่วนตัว</div>
    <div class="form-group">
      <label for="display-name">ชื่อ-นามสกุล</label>
      <input type="text" id="display-name" placeholder="เช่น นางสาวสมใจ ใจดี" />
    </div>
    <div class="form-group">
      <label for="position">ตำแหน่ง</label>
      <select id="position">
        <option value="">-- เลือกตำแหน่ง --</option>
        <option>ครู</option>
        <option>ผู้อำนวยการโรงเรียน</option>
        <option>ศึกษานิเทศก์</option>
      </select>
    </div>
    <div class="form-group">
      <label for="grade">ชั้นที่สอน</label>
      <select id="grade">
        <option value="">-- เลือกชั้นที่สอน --</option>
        <optgroup label="อนุบาล">
          <option>อนุบาล 1</option><option>อนุบาล 2</option><option>อนุบาล 3</option>
        </optgroup>
        <optgroup label="ประถมศึกษา">
          <option>ป.1</option><option>ป.2</option><option>ป.3</option>
          <option>ป.4</option><option>ป.5</option><option>ป.6</option>
        </optgroup>
        <optgroup label="มัธยมศึกษาตอนต้น">
          <option>ม.1</option><option>ม.2</option><option>ม.3</option>
        </optgroup>
        <optgroup label="มัธยมศึกษาตอนปลาย">
          <option>ม.4</option><option>ม.5</option><option>ม.6</option>
        </optgroup>
      </select>
    </div>
    <div class="form-group">
      <label for="school">โรงเรียน</label>
      <input type="text" id="school" placeholder="เช่น โรงเรียนบ้านหนองเล็ก" />
    </div>
    <div class="form-group">
      <label for="district">สังกัด</label>
      <input type="text" id="district" placeholder="เช่น สพป.กาฬสินธุ์ เขต 3" />
    </div>
    <div class="form-group">
      <label for="semester">ภาคเรียน / ปีการศึกษา</label>
      <input type="text" id="semester" placeholder="เช่น ภาคเรียนที่ 1/2567" />
    </div>

    <div class="btn-row">
      <button class="btn btn-secondary" onclick="window.location.href='home.html'">← กลับ</button>
      <button class="btn btn-primary" id="btn-save" onclick="saveProfile()">บันทึก</button>
    </div>
  </div>
</main>

<div id="footer-container"></div>


<script src="js/auth.js"></script>
<script src="js/include.js"></script>

<script>
    loadComponent('footer-container', 'components/footer.html');

  const user = Auth.requireAuth();
  if (!user) throw new Error('not auth');

  // Pre-fill fields
  document.getElementById('email').value = user.email || '';

  async function loadProfile() {
    try {
      const res = await fetch(
        `https://otnrmfgquzjfidycehqo.supabase.co/rest/v1/profiles?id=eq.${user.id}&select=*`,
        {
          headers: {
            apikey: 'sb_publishable_wO5l7ypI7_u1tw8nt5ce-g_PMzAU-lM',
            Authorization: `Bearer ${Auth.getToken()}`,
          },
        }
      );
      const data = await res.json();
      const p = data[0] || user;
      document.getElementById('display-name').value = p.display_name || '';
      document.getElementById('position').value     = p.position     || '';
      document.getElementById('grade').value        = p.grade        || '';
      document.getElementById('school').value       = p.school       || '';
      document.getElementById('district').value     = p.district     || '';
      document.getElementById('semester').value     = p.semester     || '';
    } catch {
      document.getElementById('display-name').value = user.display_name || '';
      document.getElementById('position').value     = user.position     || '';
      document.getElementById('grade').value        = user.grade        || '';
      document.getElementById('school').value       = user.school       || '';
      document.getElementById('district').value     = user.district     || '';
      document.getElementById('semester').value     = user.semester     || '';
    }
  }

  async function saveProfile() {
    const display_name = document.getElementById('display-name').value.trim();
    const position     = document.getElementById('position').value;
    const grade        = document.getElementById('grade').value;
    const school       = document.getElementById('school').value.trim();
    const district     = document.getElementById('district').value.trim();
    const semester     = document.getElementById('semester').value.trim();
    const err          = document.getElementById('error-msg');
    const btn          = document.getElementById('btn-save');

    err.classList.remove('show');
    document.getElementById('success-msg').style.display = 'none';

    if (!display_name || !school || !district) {
      err.textContent = 'กรุณากรอก ชื่อ-นามสกุล โรงเรียน และสังกัด';
      err.classList.add('show'); return;
    }

    btn.disabled = true;
    btn.textContent = 'กำลังบันทึก...';

    try {
      await Auth.updateProfile({ display_name, position, grade, school, district, semester });
      document.getElementById('success-msg').style.display = 'block';
      document.getElementById('success-msg').scrollIntoView({ behavior: 'smooth', block: 'center' });
    } catch (e) {
      err.textContent = 'เกิดข้อผิดพลาด: ' + e.message;
      err.classList.add('show');
    } finally {
      btn.disabled = false;
      btn.textContent = 'บันทึก';
    }
  }

  loadProfile();
</script>
</body>
</html>
