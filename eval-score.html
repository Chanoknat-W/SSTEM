<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ตรวจเอกสาร | SST-EM</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .doc-check-row { display:flex; gap:8px; margin-top:6px; }
    .doc-check-btn { padding:5px 14px; border-radius:20px; font-size:12px; font-weight:700; border:1.5px solid; cursor:pointer; background:none; transition:.15s; }
    .doc-check-btn.pass { color:#2E7D32; border-color:#2E7D32; }
    .doc-check-btn.fail { color:#B71C1C; border-color:#B71C1C; }
    .doc-check-btn.pass.active { background:#2E7D32; color:#fff; }
    .doc-check-btn.fail.active { background:#B71C1C; color:#fff; }
  </style>
</head>
<body class="evaluator-theme">

<main class="page">
    <div class="page-header">
      <div class="badge">ผู้ประเมิน</div>
      <h1>ตรวจสอบเอกสารประกอบ</h1>
    </div>

    <div id="loading" class="card" style="text-align:center; color:var(--text-muted); padding:32px;">กำลังโหลด...</div>
    <div id="content" style="display:none;">

      <!-- Teacher Info -->
      <div class="card" style="margin-bottom:16px;">
        <div id="teacher-info"></div>
      </div>

      <!-- Files by Domain -->
      <div id="files-d1" class="upload-section" style="margin-bottom:16px; display:none;">
        <div class="upload-section-header upload-d1">ด้านที่ 1 — การจัดการเรียนรู้</div>
        <div class="upload-items" id="files-d1-list"></div>
      </div>

      <div id="files-d2" class="upload-section" style="margin-bottom:16px; display:none;">
        <div class="upload-section-header upload-d2">ด้านที่ 2 — สถาบันและบริบท</div>
        <div class="upload-items" id="files-d2-list"></div>
      </div>

      <div id="files-d3" class="upload-section" style="margin-bottom:16px; display:none;">
        <div class="upload-section-header upload-d3">ด้านที่ 3 — พฤติกรรมวิชาชีพ</div>
        <div class="upload-items" id="files-d3-list"></div>
      </div>

      <div id="no-files" class="card" style="display:none; text-align:center; color:var(--text-muted); padding:20px;">
        ยังไม่มีเอกสารแนบ
      </div>

      <div class="btn-row">
        <button class="btn btn-secondary" onclick="window.location.href='eval-search.html'">← กลับ</button>
        <button class="btn btn-primary" onclick="startEval()">เริ่มตอบคำถามประเมิน →</button>
      </div>
    </div>
  </main>

  <div id="footer-container"></div>


  <script src="js/auth.js"></script>
  <script src="js/supabase.js"></script>
<script src="js/include.js"></script>

  <script>
    loadComponent('footer-container', 'components/footer.html');

    const user = Auth.requireAuth();
    if (!user) throw new Error('not auth');

    const params = new URLSearchParams(location.search);
    const evalId = params.get('id');
    if (!evalId) window.location.href = 'eval-search.html';

    const FILE_LABEL = {
      d1_1:'1.1 แบบบันทึกการสะท้อนคิด',
      d1_2:'1.2 แบบสังเกตการสอน / ร่องรอยใบงาน',
      d1_3:'1.3 แบบสังเกตห้องเรียน / ภาพถ่ายสื่อ',
      d2_1:'2.1 แบบประเมินการมีส่วนร่วมชุมชน',
      d2_2:'2.2 บันทึกเชิญวิทยากร / ภาพถ่ายกิจกรรม',
      d2_3:'2.3 แบบสัมภาษณ์ตัวแทนกรรมการสถานศึกษา',
      d3_1:'3.1 เกณฑ์รูบริคภาวะผู้นำทางวิชาการ',
      d3_2:'3.2 แบบบันทึก One-Page Reflector',
      d3_3:'3.3 แบบสังเกตพฤติกรรม / สัมภาษณ์เพื่อนครู',
      d3_4:'3.4 แบบสังเกตพฤติกรรมการทำงาน',
    };

    const docChecks = JSON.parse(localStorage.getItem('sst_doc_checks') || '{}');
    let allFileKeys = [];

    function setDocCheck(key, status) {
      if (docChecks[key] === status) {
        delete docChecks[key];
      } else {
        docChecks[key] = status;
      }
      localStorage.setItem('sst_doc_checks', JSON.stringify(docChecks));
      document.getElementById('chk-pass-' + key).classList.toggle('active', docChecks[key] === 'pass');
      document.getElementById('chk-fail-' + key).classList.toggle('active', docChecks[key] === 'fail');
    }

    function renderFiles(prefix, files, fileKeys) {
      const domainKeys = fileKeys.filter(k => k.startsWith(prefix));
      if (!domainKeys.length) return;
      const section = document.getElementById(`files-${prefix}`);
      const list    = document.getElementById(`files-${prefix}-list`);
      section.style.display = 'block';
      list.innerHTML = domainKeys.map(k => `
        <div class="upload-item">
          <div class="upload-label">${FILE_LABEL[k] || k}</div>
          <a href="${files[k].url}" target="_blank" class="upload-btn-label">เปิดไฟล์</a>
          <span class="upload-filename" style="color:var(--primary);">✓ ${files[k].name}</span>
          <div class="doc-check-row">
            <button class="doc-check-btn pass${docChecks[k] === 'pass' ? ' active' : ''}" id="chk-pass-${k}" onclick="setDocCheck('${k}','pass')">✓ ผ่าน</button>
            <button class="doc-check-btn fail${docChecks[k] === 'fail' ? ' active' : ''}" id="chk-fail-${k}" onclick="setDocCheck('${k}','fail')">✗ ไม่ผ่าน</button>
          </div>
        </div>`).join('');
    }

    async function load() {
      try {
        const row = await SupabaseClient.getEvaluation(evalId);
        if (!row) throw new Error('ไม่พบข้อมูล');

        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'block';

        document.getElementById('teacher-info').innerHTML = `
          <div style="font-size:18px; font-weight:700; color:var(--primary-dark); margin-bottom:6px;">${row.teacher_name || '-'}</div>
          <div style="font-size:14px; color:var(--text-muted);">
            ชั้นที่สอน: ${row.grade || '-'} &nbsp;·&nbsp;
            โรงเรียน: ${row.school || '-'} &nbsp;·&nbsp;
            สังกัด: ${row.district || '-'}
          </div>
          <div style="font-size:14px; color:var(--text-muted);">ภาคเรียน: ${row.semester || '-'}</div>`;

        // Pre-populate doc_checks from DB before rendering (so buttons show correct state)
        const existingChecks = row.doc_checks && Object.keys(row.doc_checks).length ? row.doc_checks : {};
        Object.assign(docChecks, existingChecks);

        // Pre-populate eval answers from DB
        ['sst_eval_domain1','sst_eval_domain2','sst_eval_domain3'].forEach(k => localStorage.removeItem(k));
        if (row.eval_scores) {
          ['domain1','domain2','domain3'].forEach(dk => {
            if (row.eval_scores[dk]) localStorage.setItem('sst_eval_' + dk, JSON.stringify(row.eval_scores[dk]));
          });
        }

        const files    = row.files || {};
        const fileKeys = Object.keys(files);

        if (!fileKeys.length) {
          document.getElementById('no-files').style.display = 'block';
        } else {
          allFileKeys = fileKeys;
          renderFiles('d1', files, fileKeys);
          renderFiles('d2', files, fileKeys);
          renderFiles('d3', files, fileKeys);
        }

        // Store target eval id for domain pages
        localStorage.setItem('sst_eval_target_id', evalId);
        if (Object.keys(existingChecks).length) {
          localStorage.setItem('sst_doc_checks', JSON.stringify(docChecks));
        } else {
          localStorage.removeItem('sst_doc_checks');
        }

      } catch (e) {
        if (e.message === '__SESSION_EXPIRED__') return;
        document.getElementById('loading').textContent = 'เกิดข้อผิดพลาด: ' + e.message;
      }
    }

    function startEval() {
      const unchecked = allFileKeys.filter(k => !docChecks[k]);
      if (unchecked.length) {
        alert(`กรุณาติ๊กผ่านหรือไม่ผ่านให้ครบทุกเอกสารก่อน\nยังไม่ได้ติ๊ก ${unchecked.length} รายการ`);
        return;
      }
      window.location.href = 'eval-domain.html';
    }

    load();
  </script>
</body>
</html>
